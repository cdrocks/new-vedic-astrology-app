<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Vedic Astrology · Cosmic Orrery</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --gold: #dfc691;
            --gold-bright: #f7e096;
            --ink: #ece7db;
        }

        * {
            box-sizing: border-box;
            -webkit-user-select: none;
            user-select: none;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            height: 100%;
            width: 100%;
            background: #000;
            overflow: hidden;
            font-family: 'Inter', sans-serif;
            color: var(--ink);
            touch-action: none;
        }

        canvas {
            position: fixed;
            inset: 0;
            z-index: 0;
            display: block;
            width: 100vw;
            height: 100vh;
        }

        /* Boot screen: silent, elegant, no text */
        #boot {
            position: fixed;
            inset: 0;
            background: #000;
            z-index: 50;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: opacity 1.5s cubic-bezier(0.16, 1, 0.3, 1);
            pointer-events: none;
        }

        #boot.gone {
            opacity: 0;
            pointer-events: none;
        }

        .boot-ring {
            width: 44px;
            height: 44px;
            border: 2px solid rgba(223, 198, 145, 0.15);
            border-top: 2px solid rgba(223, 198, 145, 0.85);
            border-radius: 50%;
            animation: bootSpin 1.2s cubic-bezier(0.4, 0, 0.2, 1) infinite;
        }

        @keyframes bootSpin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* The ENTER NOW button */
        .enter-container {
            position: fixed;
            bottom: 54px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 20;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            pointer-events: auto;
            transition: opacity 0.8s ease, transform 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .btn-enter {
            position: relative;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 16px 44px;
            background: linear-gradient(135deg, rgba(22, 18, 32, 0.88) 0%, rgba(12, 10, 18, 0.94) 100%);
            border: 1px solid rgba(223, 198, 145, 0.55);
            border-radius: 999px;
            color: #f7ede0;
            text-decoration: none;
            font-family: 'Marcellus', 'Inter', serif;
            font-size: 15px;
            letter-spacing: 0.38em;
            text-transform: uppercase;
            cursor: pointer;
            overflow: hidden;
            outline: none;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.7), 0 0 28px rgba(212, 175, 55, 0.25), inset 0 0 16px rgba(223, 198, 145, 0.15);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.35s ease, border-color 0.35s ease;
            touch-action: manipulation;
        }

        .btn-enter:hover,
        .btn-enter:focus-visible {
            transform: scale(1.05);
            border-color: rgba(247, 224, 150, 0.95);
            box-shadow: 0 14px 45px rgba(0, 0, 0, 0.8), 0 0 45px rgba(212, 175, 55, 0.45), inset 0 0 22px rgba(247, 224, 150, 0.3);
        }

        .btn-enter:active {
            transform: scale(0.97);
        }

        .btn-enter-glow {
            position: absolute;
            inset: -2px;
            border-radius: 999px;
            background: radial-gradient(circle at 50% 50%, rgba(223, 198, 145, 0.35), transparent 70%);
            opacity: 0.6;
            animation: enterPulse 3s ease-in-out infinite alternate;
            pointer-events: none;
        }

        @keyframes enterPulse {
            0% { opacity: 0.35; transform: scale(0.96); }
            100% { opacity: 0.85; transform: scale(1.04); }
        }

        .btn-enter-shimmer {
            position: absolute;
            top: 0;
            left: -120%;
            width: 80%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 235, 175, 0.35), transparent);
            transform: skewX(-25deg);
            animation: enterShimmer 4s ease-in-out infinite;
            pointer-events: none;
        }

        @keyframes enterShimmer {
            0%, 30% { left: -120%; }
            70%, 100% { left: 160%; }
        }

        .btn-enter-content {
            position: relative;
            z-index: 2;
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .btn-enter-spark {
            color: var(--gold);
            font-size: 13px;
            line-height: 1;
        }

        .btn-enter-text {
            padding-left: 0.38em;
        }

        @media (max-width: 640px) {
            .enter-container {
                bottom: 34px;
            }
            .btn-enter {
                padding: 14px 34px;
                font-size: 13px;
                letter-spacing: 0.3em;
            }
        }
    </style>
</head>

            ctx.fillStyle = g; ctx.fillRect(0, 0, 256, 256);
            const t = new THREE.CanvasTexture(c);
            [[64, 0.95], [145, 0.32]].forEach(([sc, op]) => {
                const m = new THREE.SpriteMaterial({
                    map: t, transparent: true, opacity: op, depthWrite: false,
                    blending: THREE.AdditiveBlending, color: new THREE.Color(1.35, 1.15, 0.95)
                });
                const s = new THREE.Sprite(m); s.scale.set(sc, sc, 1); scene.add(s); coronaSprites.push(m);
            });
        }

        const CFG = [
            { key: 'mercury', r: 1.45, dist: 34, spin: 0.030, tilt: 0.01, inc: [0.10, 0.03] },
            { key: 'venus', r: 2.35, dist: 47, spin: -0.012, tilt: 3.09, inc: [0.05, 0.02] },
            { key: 'earth', r: 2.55, dist: 63, spin: 0.140, tilt: 0.41, inc: [0.00, 0.00] },
            { key: 'mars', r: 1.95, dist: 80, spin: 0.130, tilt: 0.44, inc: [0.05, 0.03] },
            { key: 'jupiter', r: 7.8, dist: 138, spin: 0.300, tilt: 0.06, inc: [0.03, 0.02] },
            { key: 'saturn', r: 6.7, dist: 184, spin: 0.270, tilt: 0.47, inc: [0.06, 0.04] },
            { key: 'uranus', r: 4.1, dist: 228, spin: 0.200, tilt: 1.71, inc: [0.04, 0.02] },
            { key: 'neptune', r: 3.95, dist: 266, spin: 0.220, tilt: 0.49, inc: [0.05, 0.03] },
        ];
        const SHELLS = {
            venus: { c: 0xd8c290, m: 0.55, s: 1.14 }, earth: { c: 0x3f6fd9, m: 1.0, s: 1.16 },
            mars: { c: 0xc08060, m: 0.35, s: 1.12 }, jupiter: { c: 0xd8c0a0, m: 0.4, s: 1.09 },
            saturn: { c: 0xe0d0a8, m: 0.35, s: 1.09 }, uranus: { c: 0x9fd8dd, m: 0.55, s: 1.12 },
            neptune: { c: 0x4f7fe8, m: 0.7, s: 1.13 },
        };
        const spd = d => 0.065 * Math.pow(63 / d, 1.25);

        function buildMoon(earthAnchor, canvas) {
            moonPivot = new THREE.Group(); moonPivot.rotation.x = 0.09; earthAnchor.add(moonPivot);
            moonPivot.add(orbitLine(6.2, 0.05));
            moonAnchor = new THREE.Group(); moonPivot.add(moonAnchor);
            moonMesh = new THREE.Mesh(new THREE.SphereGeometry(0.7, 48, 32),
                new THREE.MeshStandardMaterial({ map: toTex(canvas), roughness: 0.85, metalness: 0.05 }));
            moonAnchor.add(moonMesh);
        }
        function buildPlanet(cfg, map, extra = {}) {
            const plane = new THREE.Group();
            plane.rotation.x = cfg.inc[0]; plane.rotation.z = cfg.inc[1];
            scene.add(plane);
            plane.add(orbitLine(cfg.dist, 0.07));
            const anchor = new THREE.Group(); plane.add(anchor); anchors[cfg.key] = anchor;
            const tiltG = new THREE.Group(); tiltG.rotation.z = cfg.tilt; anchor.add(tiltG);
            let mesh;
            if (cfg.key === 'earth') {
                earthMat = new THREE.ShaderMaterial({
                    uniforms: { uDay: { value: toTex(map.day) }, uNight: { value: toTex(map.night) }, uSunDir: { value: new THREE.Vector3(1, 0, 0) } },
                    vertexShader: EARTH_V, fragmentShader: EARTH_F
                });
                mesh = new THREE.Mesh(new THREE.SphereGeometry(cfg.r, 64, 44), earthMat);
            } else {
                mesh = new THREE.Mesh(new THREE.SphereGeometry(cfg.r, 64, 44),
                    new THREE.MeshStandardMaterial({ map: toTex(map), roughness: 0.85, metalness: 0.05 }));
            }
            tiltG.add(mesh);
            const p = { cfg, anchor, mesh, angle: Math.random() * Math.PI * 2 };
            if (extra.clouds) {
                const cm = new THREE.Mesh(new THREE.SphereGeometry(cfg.r * 1.02, 48, 32),
                    new THREE.MeshLambertMaterial({ map: toTex(extra.clouds), transparent: true, depthWrite: false }));
                cm.renderOrder = 1; tiltG.add(cm); p.clouds = cm;
            }
            const sh = SHELLS[cfg.key];
            if (sh) {
                const smat = new THREE.ShaderMaterial({
                    uniforms: {
                        uColor: { value: new THREE.Color(sh.c) }, uSunDir: { value: new THREE.Vector3(1, 0, 0) },
                        uCenter: { value: new THREE.Vector3() }, uMul: { value: sh.m }
                    },
                    vertexShader: ATM_V, fragmentShader: ATM_F, side: THREE.BackSide,
                    transparent: true, depthWrite: false, blending: THREE.AdditiveBlending
                });
                const shm = new THREE.Mesh(new THREE.SphereGeometry(cfg.r * sh.s, 48, 32), smat);
                shm.renderOrder = 3; tiltG.add(shm);
                shellsArr.push({ mesh: shm, mat: smat });
            }
            if (extra.ring) {
                const rm = ringMesh(extra.ring.inner, extra.ring.outer, extra.ring.canvas);
                rm.renderOrder = 2; tiltG.add(rm);
            }
            if (cfg.key === 'earth') buildMoon(anchor, extra.moon);
            planets.push(p);
        }
        function buildBelt() {
            beltGroup = new THREE.Group(); scene.add(beltGroup);
            const n = 2600, pr = renderer.getPixelRatio();
            const pos = new Float32Array(n * 3), col = new Float32Array(n * 3),
                siz = new Float32Array(n), ph = new Float32Array(n), sp = new Float32Array(n);
            for (let i = 0; i < n; i++) {
                const a = Math.random() * 6.2832;
                const r = 111 + (Math.random() + Math.random() + Math.random() - 1.5) * 14;
                pos[i * 3] = Math.cos(a) * r;
                pos[i * 3 + 1] = (Math.random() + Math.random() + Math.random() + Math.random() - 2) * 1.6;
                pos[i * 3 + 2] = Math.sin(a) * r;
                const g = 0.45 + Math.random() * 0.35;
                col[i * 3] = g; col[i * 3 + 1] = g * 0.96; col[i * 3 + 2] = g * 0.9;
                siz[i] = (1 + Math.random() * 2.4) * pr;
                ph[i] = Math.random() * 6.2832; sp[i] = 0;
            }
            const g = new THREE.BufferGeometry();
            g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
            g.setAttribute('aColor', new THREE.BufferAttribute(col, 3));
            g.setAttribute('aSize', new THREE.BufferAttribute(siz, 1));
            g.setAttribute('aPhase', new THREE.BufferAttribute(ph, 1));
            g.setAttribute('aSpd', new THREE.BufferAttribute(sp, 1));
            const m = new THREE.ShaderMaterial({
                uniforms: { uTime: { value: 0 } }, vertexShader: STAR_V, fragmentShader: BELT_F,
                transparent: true, depthWrite: false
            });
            beltGroup.add(new THREE.Points(g, m));
            beltPt = new THREE.Vector3(105 * Math.cos(1.2), 1.5, 105 * Math.sin(1.2));
        }

        /* ============================================================ director */
        const SUBJ = {
            sun: { w: 1.0, dist: 62, phi: [0.08, 0.40], styles: ['random'], pos: v => v.set(0, 0, 0) },
            mercury: { w: 0.6, dist: 9.5, styles: ['side', 'front', 'threequarter'], pos: v => anchors.mercury.getWorldPosition(v) },
            venus: { w: 0.95, dist: 14, styles: ['side', 'front', 'threequarter'], pos: v => anchors.venus.getWorldPosition(v) },
            earth: { w: 1.3, dist: 15, styles: ['side', 'front', 'threequarter'], pos: v => anchors.earth.getWorldPosition(v) },
            luna: { w: 0.5, dist: 4.2, styles: ['side', 'front', 'threequarter'], pos: v => moonAnchor.getWorldPosition(v) },
            mars: { w: 0.95, dist: 11, styles: ['side', 'front', 'threequarter'], pos: v => anchors.mars.getWorldPosition(v) },
            jupiter: { w: 1.25, dist: 26, styles: ['side', 'front', 'threequarter'], pos: v => anchors.jupiter.getWorldPosition(v) },
            saturn: { w: 1.35, dist: 24, styles: ['side', 'edge', 'front', 'threequarter'], pos: v => anchors.saturn.getWorldPosition(v) },
            uranus: { w: 0.75, dist: 17, styles: ['side', 'front', 'threequarter'], pos: v => anchors.uranus.getWorldPosition(v) },
            neptune: { w: 0.85, dist: 16, styles: ['side', 'front', 'threequarter'], pos: v => anchors.neptune.getWorldPosition(v) },
            belt: { w: 0.55, dist: 64, phi: [0.15, 0.5], styles: ['random'], pos: v => v.copy(beltPt) },
            system: { w: 0.75, dist: 340, phi: [0.5, 0.9], styles: ['random'], pos: v => v.set(0, 0, 0) },
        };
        const forced = ['earth', 'jupiter', 'saturn', 'mars', 'venus'];

        let tNow = 0, shotA = null, shotB = null, trans = 1, shotCount = 0;
        let userTheta = 0, userPhi = 0, distScale = 1, lastAct = 0, dragging = false, lastX = 0, lastY = 0;

        function newShot(key, opts = {}) {
            const def = SUBJ[key];
            const shot = {
                key, getPos: def.pos, t0: tNow, dur: 13 + Math.random() * 8,
                drift: (Math.random() < 0.5 ? -1 : 1) * (0.03 + Math.random() * 0.045),
                seed: Math.random() * 40, phiAmp: 0.07 + Math.random() * 0.05, special: null
            };
            let style = opts.style || def.styles[(Math.random() * def.styles.length) | 0];
            const pos = new THREE.Vector3(); def.pos(pos);
            const d0 = new THREE.Vector3();
            if (style === 'front') {
                d0.copy(pos).normalize().negate();
            } else if (style === 'threequarter') {
                const front = pos.clone().normalize().negate();
                const side = new THREE.Vector3(-pos.z, 0, pos.x).normalize();
                if (Math.random() < 0.5) side.negate();
                d0.addVectors(front.multiplyScalar(0.75), side.multiplyScalar(0.65)).normalize();
            } else if (style === 'side') {
                d0.set(-pos.z, 0, pos.x).normalize();
                if (Math.random() < 0.5) d0.negate();
            } else {
                const a = Math.random() * 6.2832;
                d0.set(Math.cos(a), 0, Math.sin(a));
            }
            shot.theta0 = Math.atan2(d0.z, d0.x);
            const phiMap = {
                front: 0.12 + Math.random() * 0.35, threequarter: 0.12 + Math.random() * 0.35,
                side: 0.10 + Math.random() * 0.35, edge: 0.03, random: 0.18 + Math.random() * 0.5
            };
            shot.phi0 = def.phi ? def.phi[0] + Math.random() * (def.phi[1] - def.phi[0]) : phiMap[style] || 0.3;
            if (style === 'edge') { shot.phiAmp = 0.02; }
            shot.dist0 = (opts.dist0 || def.dist * (0.92 + Math.random() * 0.25)) * (shot.distMul || 1);
            shot.dist1 = opts.dist1 || shot.dist0 * (0.8 + Math.random() * 0.08);
            if (style === 'edge') { shot.dist0 = 20; shot.dist1 = 17; }
            if (opts.dur) shot.dur = opts.dur;
            return shot;
        }

        const TA = new THREE.Vector3(), TB = new THREE.Vector3(), TV = new THREE.Vector3();
        function shotCam(shot, outC, outL) {
            const pos = shot.getPos(TA);
            const tau = tNow - shot.t0;
            const u = Math.min(1, tau / shot.dur);
            const R = lerp(shot.dist0, shot.dist1, smoother(u)) * (1 + Math.sin(tau * 0.06 + shot.seed) * 0.045) * distScale;
            const th = shot.theta0 + tau * shot.drift + userTheta;
            const ph = clamp(shot.phi0 + Math.sin(tau * 0.09 + shot.seed) * shot.phiAmp + userPhi, -1.25, 1.25);
            outC.set(pos.x + Math.cos(ph) * Math.cos(th) * R, pos.y + Math.sin(ph) * R, pos.z + Math.cos(ph) * Math.sin(th) * R);
            outL.copy(pos);
        }

        const CA = new THREE.Vector3(), LA = new THREE.Vector3(), CB = new THREE.Vector3(), LB = new THREE.Vector3();
        const camPos = new THREE.Vector3(), look = new THREE.Vector3();
        function pickSubject() {
            let tot = 0; for (const k in SUBJ) tot += SUBJ[k].w;
            for (let tries = 0; tries < 8; tries++) {
                let r = Math.random() * tot;
                for (const k in SUBJ) { r -= SUBJ[k].w; if (r <= 0) { if (k !== shotB.key) return k; break; } }
            }
            return 'earth';
        }
        function nextSubject() { return forced.length ? forced.shift() : pickSubject(); }

        function goTo(key, opts) {
            shotA = shotB; shotB = newShot(key, opts); trans = 0;
            shotCount++;
        }

        /* ============================================================ input */
        function act() { lastAct = performance.now(); }
        addEventListener('pointerdown', e => { dragging = true; lastX = e.clientX; lastY = e.clientY; act(); });
        addEventListener('pointermove', e => {
            act();
            if (!dragging) return;
            userTheta -= (e.clientX - lastX) * 0.0042;
            userPhi = clamp(userPhi + (e.clientY - lastY) * 0.0032, -0.85, 0.85);
            lastX = e.clientX; lastY = e.clientY;
        });
        addEventListener('pointerup', () => dragging = false);
        addEventListener('wheel', e => { act(); distScale = clamp(distScale * (1 + e.deltaY * 0.0011), 0.45, 3.4); }, { passive: true });
        addEventListener('resize', () => {
            camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
            renderer.setSize(innerWidth, innerHeight);
            composer.setSize(innerWidth, innerHeight);
            renderer.getDrawingBufferSize(grade.uniforms.uRes.value);
        });

        /* ============================================================ loop */
        const clock = new THREE.Clock();
        let moonAngle = 0;
        function loop() {
            requestAnimationFrame(loop);
            const dt = Math.min(0.05, clock.getDelta());
            tNow += dt;

            for (const p of planets) {
                p.angle += spd(p.cfg.dist) * dt;
                p.anchor.position.set(Math.cos(p.angle) * p.cfg.dist, 0, Math.sin(p.angle) * p.cfg.dist);
                p.mesh.rotation.y += p.cfg.spin * dt;
                if (p.clouds) p.clouds.rotation.y += p.cfg.spin * 1.28 * dt;
            }
            moonAngle += 0.075 * dt;
            moonAnchor.position.set(Math.cos(moonAngle) * 6.2, 0, Math.sin(moonAngle) * 6.2);
            moonMesh.rotation.y = -moonAngle;
            beltGroup.rotation.y += 0.006 * dt;
            sunMesh.rotation.y += 0.004 * dt;
            coronaSprites.forEach((m, i) => m.rotation += dt * 0.01 * (i ? -1 : 1));

            sunMat.uniforms.uTime.value = tNow;
            starMat.uniforms.uTime.value = tNow;
            grade.uniforms.uTime.value = tNow;
            for (const s of shellsArr) {
                s.mesh.getWorldPosition(TV);
                s.mat.uniforms.uCenter.value.copy(TV);
                s.mat.uniforms.uSunDir.value.copy(TV).negate().normalize();
            }
            anchors.earth.getWorldPosition(TV);
            earthMat.uniforms.uSunDir.value.copy(TV).negate().normalize();

            if (performance.now() - lastAct > 6000) {
                const k = 1 - Math.exp(-dt * 0.7);
                userTheta += (0 - userTheta) * k; userPhi += (0 - userPhi) * k;
                distScale += (1 - distScale) * k * 0.6;
            }

            trans = Math.min(1, trans + dt / 4.0);
            const e = smoother(trans);
            shotCam(shotB, CB, LB);
            if (trans < 1 && shotA) {
                shotCam(shotA, CA, LA);
                camPos.lerpVectors(CA, CB, e); look.lerpVectors(LA, LB, e);
            } else {
                camPos.copy(CB); look.copy(LB);
                if (tNow - shotB.t0 > shotB.dur) goTo(nextSubject());
            }

            const amp = camPos.distanceTo(look) * 0.0055;
            camera.position.set(
                camPos.x + (Math.sin(tNow * 0.33 + 2.0) + Math.sin(tNow * 0.71) * 0.5) * amp,
                camPos.y + (Math.sin(tNow * 0.41 + 4.0) + Math.sin(tNow * 0.83 + 1.0) * 0.5) * amp * 0.7,
                camPos.z + (Math.sin(tNow * 0.29 + 1.0) + Math.sin(tNow * 0.67 + 3.0) * 0.5) * amp * 0.6);
            camera.lookAt(look);
            camera.rotateZ(Math.sin(tNow * 0.047) * 0.011 + Math.sin(tNow * 0.019 + 2) * 0.007);

            composer.render();
        }

        /* ============================================================ init */
        const nextFrame = () => new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));

        (async function init() {
            try {
                await nextFrame();
                buildStars();
                await nextFrame();
                buildSun();

                for (const cfg of CFG) {
                    await nextFrame();
                    let map, extra = {};
                    if (cfg.key === 'mercury') map = texMercury();
                    else if (cfg.key === 'venus') map = texVenus();
                    else if (cfg.key === 'earth') {
                        const e = texEarthPair();
                        await nextFrame();
                        extra = { day: e.day, night: e.night, clouds: e.clouds, moon: texMoon() };
                        map = e.day;
                    }
                    else if (cfg.key === 'mars') map = texMars();
                    else if (cfg.key === 'jupiter') map = texJupiter();
                    else if (cfg.key === 'saturn') {
                        const satN = makeNoise3(mulberry32(72));
                        map = texSaturn();
                        extra = { ring: { inner: 8.4, outer: 16.1, canvas: ringProfileCanvas(satN) } };
                    }
                    else if (cfg.key === 'uranus') {
                        map = texUranus();
                        extra = { ring: { inner: 6.6, outer: 8.6, canvas: uranusRingCanvas() } };
                    }
                    else map = texNeptune();
                    buildPlanet(cfg, map, extra);
                }
                await nextFrame();
                buildBelt();
                await nextFrame();

                shotCount = 1;
                shotB = newShot('system', { dist0: 820, dist1: 230, dur: 20 });
                shotB.phi0 = 0.6; shotB.phiAmp = 0.05;

                composer.render();
                requestAnimationFrame(loop);
                setTimeout(() => {
                    const boot = document.getElementById('boot');
                    if (boot) boot.classList.add('gone');
                }, 400);
            } catch (err) {
                console.error(err);
                const boot = document.getElementById('boot');
                if (boot) boot.classList.add('gone');
            }
        })();
    </script>
</body>
