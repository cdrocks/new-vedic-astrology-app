name: Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install skyfield jplephem fastapi uvicorn pydantic pytest httpx hypothesis
          # Optional oracle cross-validation dependency
          pip install pyswisseph || echo "pyswisseph install skipped or failed"

      - name: Verify or Download DE421 Ephemeris
        run: |
          mkdir -p vedic_astro_api/data
          if [ ! -f vedic_astro_api/data/de421.bsp ]; then
            python -c "from skyfield.api import Loader; load = Loader('vedic_astro_api/data'); load('de421.bsp')"
          fi

      - name: Run Test Suite
        run: |
          PYTHONPATH=. pytest -v tests/test_vedic_astro_api | tee pytest_output.txt

      - name: Upload Test Output Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results
          path: pytest_output.txt
